name: Build StreamVault Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Optimized Release APK (R8 Full Mode + arm64-v8a)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload StreamVault Optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-Realme9ProPlus-v10-Perfect
          path: app/build/outputs/apk/release/app-release.apk
